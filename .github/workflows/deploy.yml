name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build with relative base path
        run: |
          if [ -d "client" ]; then
            cd client
            npm install
            npx vite build --base=./ || npm run build || true
            cd ..
            if [ -d "client/dist" ]; then
              cp -r client/dist ./dist_output
            elif [ -d "client/build" ]; then
              cp -r client/build ./dist_output
            fi
          elif [ -f "package.json" ]; then
            npm install
            npx vite build --base=./ || npm run build || true
            if [ -d "dist" ]; then
              cp -r dist ./dist_output
            elif [ -d "build" ]; then
              cp -r build ./dist_output
            fi
          fi

      - name: Ensure 404 routing fallback
        run: |
          if [ -f "dist_output/index.html" ]; then
            cp dist_output/index.html dist_output/404.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist_output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4