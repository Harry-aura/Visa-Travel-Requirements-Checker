name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and Build (Root or Subfolder)
        run: |
          if [ -f "client/package.json" ]; then
            echo "Building from client directory..."
            cd client
            npm install
            npm run build
            cd ..
            if [ -d "client/dist" ]; then
              cp -r client/dist ./dist_output
            elif [ -d "client/build" ]; then
              cp -r client/build ./dist_output
            fi
          elif [ -f "package.json" ]; then
            echo "Building from root directory..."
            npm install
            npm run build
            if [ -d "dist" ]; then
              cp -r dist ./dist_output
            elif [ -d "build" ]; then
              cp -r build ./dist_output
            fi
          fi

      - name: Fallback index if dist_output missing
        run: |
          if [ ! -d "dist_output" ]; then
            echo "Generating fallback artifact folder..."
            mkdir -p dist_output
            if [ -f "index.html" ]; then
              cp -r * dist_output/ || true
            else
              echo "<h1>Visa & Travel Requirements Checker</h1><p>Live system build successfully initiated.</p>" > dist_output/index.html
            fi
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist_output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4